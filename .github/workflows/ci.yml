# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The checks of the Windows Portable Suite on every push and pull request. The suite has a repository of its own
# (owner, 13-11-2026) and keeps no copy of the Nexus tools: every job starts with Nexus's action
# (RobertoTorino/nexus/.github/actions/suite), which checks out Nexus at the commit NEXUS_REF names and this
# repository inside it as windows-portable/, the layout the Nexus tools know (core/, tools/ and dev/ at the root).
# So the paths below are written from the Nexus root, and git in windows-portable/ is this repository's.
# The suite's tags (wp-<app>-v<x.y.z>) wait for this workflow on the commit (tools/ci_state.py, as
# tools/tag-release.sh and release.yml ask). The suite's tests run on Windows, the system it is made for, in Windows
# PowerShell as on the handheld; core with them, as its apps bundle it.
# A tag starts no run of its own.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:

  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          fetch-depth: 0                # the base commit and the tags, for check_manifest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hard-coded versions match each VERSION file
        run: python tools/check_versions.py --suite windows-portable
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python windows-portable/tools/check_manifest.py ${BASE:+--base "$BASE"}
      - name: Every former repo has its LICENSE, .gitignore, VERSION and CHANGELOG
        run: |
          rc=0
          for d in windows-portable/portal windows-portable/apps/*; do
            for f in LICENSE .gitignore VERSION CHANGELOG; do
              [ -f "$d/$f" ] || { echo "::error::$d/$f missing"; rc=1; }
            done
          done
          exit $rc

  docs:
    # The suite's wiki (docs/), as Nexus's docs.yml builds it for GitHub Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2"
      - run: mkdocs build --strict -f windows-portable/mkdocs.yml

  nexus-tools:
    # The Nexus tools' own tests with this suite in the checkout. The ones about a suite (its layout, its workflows,
    # its ICONS.md, the Nexus page's Apps and features chapter, new_app.py's Windows app) skip in Nexus's CI, which
    # has no suite of another repository: they run here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "tools/requirements-dev.txt"
      - name: Qt runtime libraries
        timeout-minutes: 5
        run: bash tools/ci-qt-libs.sh --pulse
      - name: Install
        run: python -m pip install -q -r tools/requirements-dev.txt
      - name: Test
        working-directory: tools
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  plan:
    # The pytest and installers matrices, read from the suite's folders (tools/ci_matrix.py: every folder with
    # tests/, and core, which its apps bundle; every app and the portal), so a new app needs no edit here (stage 2
    # of the release redesign, 04-11-2026).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
      - name: The folders with tests
        id: dirs
        run: python3 tools/ci_matrix.py --suite windows-portable pytest | tee -a "$GITHUB_OUTPUT"
      - name: The apps and the portal
        id: apps
        run: python3 tools/ci_matrix.py --suite windows-portable installers | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          fetch-depth: 0                # the tags: windows-portable/tools checks the shipped apps.toml, whose pins must exist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"
      - name: Install
        run: python -m pip install -q -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  installers:
    # Each app and the portal in a job of its own (owner, 29-10-2026: one job doing them all in a row took six to
    # fifteen minutes, the longest wait of every push and so of every release): its installer test, then its release
    # built as release.yml builds it (not published) and installed by the installer test on that
    # release. The portal's bundles the pinned Windows Portable Test release, downloaded from GitHub as the release
    # workflow does. The matrix is the plan job's: every app of the suite, and the portal.
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          fetch-depth: 0                # the commit time, the zip's file times
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "windows-portable/**/requirements.txt"
      - name: Installer test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/${{ matrix.app }}.ps1
      # A Nexus release's commit pins a test release the release itself makes after CI (30-10-2026: CI failed on
      # wp-test-v3.1.0, "release not found", and Release Nexus waits for CI): one not out yet whose version is the
      # test app's VERSION, as check_manifest.py allows, is built here from this commit instead.
      - name: The pinned Windows Portable Test release, for the portal's bundle
        if: matrix.app == 'portal'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("windows-portable/portal/apps.toml", "rb"))["apps"]["test"]["tag"])')
          mkdir -p bundle
          # this repository's release, or Nexus's: the releases made before the suite had a repository of its own
          repo=""
          for candidate in "$GITHUB_REPOSITORY" RobertoTorino/nexus; do
            if gh release view "$bt" --repo "$candidate" > /dev/null 2>&1; then repo=$candidate; break; fi
          done
          if [ -n "$repo" ]; then
            gh release download "$bt" --repo "$repo" --pattern "$bt.zip" --pattern SHA256SUMS --dir bundle
          elif [ "$bt" = "wp-test-v$(tr -d '[:space:]' < windows-portable/apps/test/VERSION)" ]; then
            echo "$bt is not released yet (a release commit): built from this commit for the bundle"
            python -m pip install -q -r windows-portable/apps/test/requirements.txt pyinstaller pillow
            python windows-portable/tools/build_release.py "$bt" bundle
          else
            echo "$bt is pinned but neither released nor the test app's VERSION" >&2
            exit 1
          fi
      # An app with a native core (Remote Play's): FFmpeg kept in the cache until its build.sh changes, then the
      # module built and installed for build_release.py (windows-portable/tools/build_native.sh)
      - name: FFmpeg cache
        if: hashFiles(format('windows-portable/apps/{0}/native/Cargo.toml', matrix.app)) != ''
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\windows-portable-suite\build
          key: ffmpeg-windows-${{ hashFiles(format('windows-portable/apps/{0}/native/ffmpeg/build.sh', matrix.app)) }}
      - name: Native core
        if: hashFiles(format('windows-portable/apps/{0}/native/Cargo.toml', matrix.app)) != ''
        shell: bash
        run: |
          python -m pip install -q "maturin>=1.5,<2"
          bash windows-portable/tools/build_native.sh "$APP" --setup
      - name: Build the release zip, not published
        shell: bash
        run: |
          case "$APP" in
            portal) folder=windows-portable/portal ;;
            *)      folder=windows-portable/apps/$APP ;;
          esac
          python -m pip install -q -r "$folder/requirements.txt" pyinstaller pillow
          args=()
          [ -d bundle ] && args+=(--bundle bundle)
          python windows-portable/tools/build_release.py "wp-$APP-v$(cat "$folder/VERSION")" wpdist "${args[@]}"
      - name: Installer test on the release
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/${{ matrix.app }}.ps1
          -Release (Get-Item wpdist/*.zip).FullName

  native:
    # Remote Play's native core (Rust, windows-portable/apps/rplay/native, Console Link's for Windows): its own tests,
    # clippy with and without the video decoder, and the Python module built into a wheel and tested from Python,
    # with FFmpeg from native/ffmpeg/build.sh (D3D11VA; kept in the cache until the script changes). Built with Rust's
    # x86_64-pc-windows-gnu toolchain and MSYS2's MINGW64 GCC (windows-portable/tools/build_native.sh). The pytest job
    # above skips the tests that need the built module.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "windows-portable/apps/rplay/requirements-dev.txt"
      - name: FFmpeg cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\windows-portable-suite\build
          key: ffmpeg-windows-${{ hashFiles('windows-portable/apps/rplay/native/ffmpeg/build.sh') }}
      - name: Build the module
        run: |
          python -m pip install -q -r windows-portable/apps/rplay/requirements-dev.txt "maturin>=1.5,<2"
          bash windows-portable/tools/build_native.sh rplay --setup
      - name: cargo test and clippy
        working-directory: windows-portable/apps/rplay/native
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH" RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu
          cargo test --locked --features decoder
          cargo clippy --locked --all-targets --features python,decoder -- -D warnings
          cargo clippy --locked --all-targets --features python -- -D warnings
      - name: Test the module from Python
        working-directory: windows-portable/apps/rplay
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests/test_native.py tests/test_stream.py tests/test_senkusha.py tests/test_play.py

  nexus-release-tool-installer:
    # the Windows installers of the Nexus apps (dev/nrt/install.ps1, dev/dash/install.ps1) are tested here: this
    # suite is the one on Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
      - name: "Installer test: nrt"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/nrt.ps1
      - name: "Installer test: dash"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows-portable/tools/installer-tests/dash.ps1
