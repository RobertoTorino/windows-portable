name: Release

# The releases of the Windows Portable Suite, in one of two ways:
#
# * A release of the suite: started by hand (Run workflow, or gh workflow run release.yml -f commit=<sha>) with the
#   release commit on main (the versions, the CHANGELOG entries, the new tags in apps.toml, portal/VERSION). One run
#   releases the suite: it builds every app tag apps.toml pins that has no release yet, side by side, and publishes
#   each (the tag made on the release commit); writes their sha256 into apps.toml in one commit "Pin ..." on top of
#   it; and builds the portal from that commit as a draft release (no tag yet, so no portal sees it). The draft is
#   installed on the handheld and published after the owner's yes, which makes the portal tag. Started again, the
#   run skips what is out already and makes the draft anew. The pin commit is pushed only while main is still the
#   release commit, so no other commit gets into a portal tag.
# * A tag pushed by hand, wp-<app>-v<x.y.z> (wp-test-v0.1.0): that one release, published at once. The tag's version
#   must equal that app's VERSION. A tag whose release is published already is left alone: publishing a portal's
#   draft makes its tag, on the pin commit, which has no CI run (a push with the workflow's token starts no
#   workflow), so the run would only wait for CI in vain and then build it again.
#
# The assets are <tag>.zip (the app's one-folder PyInstaller build with its install.ps1), SHA256SUMS and the notes,
# built on Windows by tools/build_release.py. A portal release bundles the release of Windows Portable Test that
# portal/apps.toml pins (downloaded from its own release and checked against the pin) and requires every pinned tag
# to exist. Never GitHub's "Latest" (--latest=false).
#
# The suite has a repository of its own (owner, 13-11-2026) and keeps no copy of the Nexus tools: every job starts
# with Nexus's action (see ci.yml), so the paths below are written from the Nexus root, with this repository in
# windows-portable/; git in windows-portable/ is this repository's.
#
# Only a commit that CI passed becomes a release: the first job waits for ci.yml on the commit, and for Nexus's
# ci-nexus.yml on the Nexus commit NEXUS_REF names (core, which every app bundles, and the release tools), up to 75
# minutes each. A release commit that only writes the release (versions, Release entries, apps.toml's tags:
# tools/release_commit.py) takes the CI that passed on its work commit, the parent; anything more waits for CI on
# the commit itself. The pin commit changes only sha256 lines and is checked here (check_manifest.py --require-tags).

on:
  push:
    tags: ["wp-*-v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      commit:
        description: The release commit (main's newest)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.commit || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 155                # ci_state waits up to 75, twice (both workflows run on the same push, so
    permissions:                        # the second wait is mostly over already)
      actions: read
      contents: read
    outputs:
      out: ${{ steps.out.outputs.out }}
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Not published already
        id: out
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$TAG is published already (publishing the draft made the tag): nothing to do."
            echo "out=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        if: steps.out.outputs.out != 'true'
        id: nexus
        with:
          folder: windows-portable
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 2                # the parent: a release commit's work commit
      - name: The release commit is main's newest
        if: steps.out.outputs.out != 'true' && github.event_name == 'workflow_dispatch'
        working-directory: windows-portable
        run: |
          git fetch -q origin main
          head=$(git rev-parse origin/main)
          [ "$head" = "$(git rev-parse HEAD)" ] ||
            { echo "main is $head, not the release commit $COMMIT: start the release again on the new main." >&2; exit 1; }
      - name: CI passed on this commit
        if: steps.out.outputs.out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --repo windows-portable --workflow ci.yml --release-commit --wait 75 "$COMMIT"
      - name: Nexus's CI passed on the Nexus commit
        if: steps.out.outputs.out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_COMMIT: ${{ steps.nexus.outputs.nexus-commit }}
        run: python3 tools/ci_state.py --repo . --workflow ci-nexus.yml --wait 75 "$NEXUS_COMMIT"

  plan:
    needs: ci
    if: needs.ci.outputs.out != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      portal: ${{ steps.plan.outputs.portal }}
      draft: ${{ steps.plan.outputs.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0                # tags, for check_manifest
      - name: Checks
        run: |
          python3 tools/check_versions.py --suite windows-portable
          python3 windows-portable/tools/check_manifest.py
      - name: What this run releases
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python3 windows-portable/tools/suite_release.py plan ${TAG:+--tag "$TAG"} | tee -a "$GITHUB_OUTPUT"

  apps:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false                  # one app's failure leaves the others' releases: a run started again skips them
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      TAG: ${{ matrix.tag }}
      COMMIT: ${{ inputs.commit || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}      # gh in the Nexus checkout would name Nexus
    defaults:
      run:
        shell: bash
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0                # tags, and the zip's file times

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Requirements
        run: |
          app=${TAG#wp-}; app=${app%-v*}
          python -m pip install -q -r "windows-portable/apps/$app/requirements.txt" pyinstaller pillow

      # An app with a native core (Remote Play's): FFmpeg kept in the cache until its build.sh changes, then the
      # module built and installed for build_release.py (windows-portable/tools/build_native.sh)
      - name: The app
        id: app
        run: |
          app=${TAG#wp-}; app=${app%-v*}
          echo "name=$app" >> "$GITHUB_OUTPUT"
      - name: FFmpeg cache
        if: hashFiles(format('windows-portable/apps/{0}/native/Cargo.toml', steps.app.outputs.name)) != ''
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\windows-portable-suite\build
          key: ffmpeg-windows-${{ hashFiles(format('windows-portable/apps/{0}/native/ffmpeg/build.sh', steps.app.outputs.name)) }}
      - name: Native core
        if: hashFiles(format('windows-portable/apps/{0}/native/Cargo.toml', steps.app.outputs.name)) != ''
        run: |
          python -m pip install -q "maturin>=1.5,<2"
          bash windows-portable/tools/build_native.sh "${{ steps.app.outputs.name }}" --setup

      - name: Build
        run: |
          python windows-portable/tools/build_release.py "$TAG" dist
          cat dist/SHA256SUMS

      - name: Publish
        run: bash windows-portable/tools/publish_release.sh "$TAG" "$COMMIT" dist

  pin:
    needs: [plan, apps]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.portal != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
      APPS: ${{ needs.plan.outputs.apps }}
      DRAFT: ${{ needs.plan.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Pin the new app releases
        id: pin
        working-directory: windows-portable     # this repository: its main, its commit, its push
        run: |
          mapfile -t tags < <(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["APPS"])))')
          if [ "$DRAFT" != true ] || [ ${#tags[@]} -eq 0 ] || [ -z "${tags[0]}" ]; then
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"          # a tag pushed by hand, or nothing to pin
            exit 0
          fi
          git fetch -q origin main
          head=$(git rev-parse origin/main)
          if [ "$head" != "$COMMIT" ]; then
            # Started again after the pins were pushed: main is that pin commit, right on top of the release commit.
            if [ "$(git rev-parse "$head^")" = "$COMMIT" ] && git log -1 --format=%s "$head" | grep -q '^Pin '; then
              echo "Pinned already in $head"
              echo "commit=$head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved on from the release commit $COMMIT to $head: nothing is pinned or tagged." >&2
            echo "Start the release again on the new main." >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            gh release download "$tag" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sums/$tag"
          done
          python3 tools/suite_release.py pin "$RUNNER_TEMP/sums" "${tags[@]}"
          python3 tools/check_manifest.py --require-tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Pin ${tags[*]}" -- portal/apps.toml
          git push origin "HEAD:refs/heads/main"         # refused when main moved meanwhile: nothing is tagged
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  portal:
    needs: [plan, pin]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.portal != '' }}
    runs-on: windows-latest
    env:
      TAG: ${{ needs.plan.outputs.portal }}
      COMMIT: ${{ needs.pin.outputs.commit }}
      DRAFT: ${{ needs.plan.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: windows-portable
          ref: ${{ needs.pin.outputs.commit }}
          fetch-depth: 0                # tags, for check_manifest and the zip's file times

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checks
        run: |
          python tools/check_versions.py --suite windows-portable
          python windows-portable/tools/check_manifest.py --require-tags
          python -m pip install -q -r windows-portable/portal/requirements.txt pyinstaller pillow

      - name: Bundled Windows Portable Test
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("windows-portable/portal/apps.toml", "rb"))["apps"]["test"]["tag"])')
          mkdir -p bundle
          gh release download "$bt" --pattern "$bt.zip" --pattern SHA256SUMS --dir bundle

      - name: Build
        run: |
          python windows-portable/tools/build_release.py "$TAG" dist --bundle bundle
          cat dist/SHA256SUMS

      - name: Publish
        run: |
          args=()
          [ "$DRAFT" = true ] && args+=(--draft)
          bash windows-portable/tools/publish_release.sh "$TAG" "$COMMIT" dist "${args[@]}"
